name: Pruebas

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Versiones instaladas
        run: python -m pip list --format=freeze | findstr /i "pandas numpy openpyxl pytest pywin32 pywebview"
      - name: Pruebas
        id: pruebas
        run: python -m pytest -q --junitxml=resultados.xml
        continue-on-error: true
      - name: Resumir fallos
        if: always()
        shell: python
        run: |
          import os, xml.etree.ElementTree as ET
          if not os.path.exists("resultados.xml"):
              print("::error::pytest no generó resultados.xml")
          else:
              raiz = ET.parse("resultados.xml").getroot()
              n = 0
              for caso in raiz.iter("testcase"):
                  for f in list(caso.findall("failure")) + list(caso.findall("error")):
                      n += 1
                      if n > 10:
                          break
                      cola = (f.text or f.get("message") or "")[-700:].replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                      print(f"::error title={caso.get('classname')}.{caso.get('name')}::{cola}")
              print(f"Pruebas con fallo o error: {n}")
      - name: Resultado
        if: steps.pruebas.outcome == 'failure'
        run: exit 1
